# SPDX-License-Identifier: Apache-2.0
#
# Read the Docs build of the documentation site. It runs the same command
# as CI's `docs` job and a local build (docs/development.md), with the
# dependencies from uv.lock's `docs` group. The pages are the repository's
# Markdown files, read in place: the configuration is docs/conf.py and the
# source directory is the repository root, hence `-c docs .`.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - asdf plugin add uv
    - asdf install uv 0.10.8
    - asdf global uv 0.10.8
    - uv run --locked --only-group docs sphinx-build -W --keep-going -c docs . "$READTHEDOCS_OUTPUT/html"
