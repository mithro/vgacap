[project]
name = "vgacap"
version = "0.0.1"
description = "Tiny Tapeout VGA capture: stream format mirror, synthetic generators, tests"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "pyserial>=3.5", "websockets>=13"]

[project.scripts]
vgacap-bin2stream = "vgacap.bin2stream:main"
ttcap = "ttcap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["vgacap", "ttcap", "ttcap.mp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
