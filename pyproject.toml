[project]
name = "vgacap"
version = "0.0.1"
description = "Tiny Tapeout VGA capture: stream format mirror, synthetic generators, tests"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "websockets>=13"]

[project.optional-dependencies]
# Synthetic generators, PPM/PNG handling and the end-to-end tests need these;
# the stream mirror and the ttcap board tools do not (keeps Pi installs light).
synth = ["numpy>=1.26", "pillow>=10"]

[project.scripts]
vgacap-bin2stream = "vgacap.bin2stream:main"
ttcap = "ttcap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "numpy>=1.26", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["vgacap", "ttcap", "ttcap.mp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
