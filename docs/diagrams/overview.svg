<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="650" viewBox="0 0 1146 650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">vgacap overview</title>
<desc id="d">Capture sources on the left write one vgacap stream in the middle; reconstruction and the tools on the right turn it into pictures, video and checks.</desc>
<style>
  .title { font-size: 14px; font-weight: 600; fill: #1d2433; }
  .detail { font-size: 12.5px; fill: #5b6577; }
  .net { font-size: 11.5px; font-weight: 600; }
  .tag { font-size: 12px; font-weight: 600; }
  .pad { font-size: 12px; font-weight: 600; fill: #1d2433; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .legend { font-size: 12.5px; fill: #1d2433; }
</style>
<defs>
<marker id="arrow-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c64d4"/></marker>
<marker id="arrow-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.0" markerHeight="3.0" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2620c"/></marker>
<marker id="arrow-pic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14845a"/></marker>
<marker id="arrow-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.1" markerHeight="4.1" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b46d6"/></marker>
</defs>
<rect x="0" y="0" width="1146" height="650" fill="#ffffff"/>
<text x="110.0" y="24" class="tag" text-anchor="middle" fill="#5b6577">UNDER CAPTURE</text>
<text x="421.0" y="24" class="tag" text-anchor="middle" fill="#5b6577">CAPTURE SOURCES</text>
<text x="814.0" y="24" class="tag" text-anchor="middle" fill="#5b6577">ONE FORMAT</text>
<text x="1044.0" y="24" class="tag" text-anchor="middle" fill="#5b6577">CONSUMERS</text>
<rect x="20" y="130.0" width="180" height="410.0" rx="4" fill="#ffffff" stroke="#1d2433" stroke-width="1.5"/>
<text x="34" y="156.0" class="title" text-anchor="start">Tiny Tapeout design</text>
<text x="34" y="178.0" class="detail" text-anchor="start">on an ASIC, an FPGA</text>
<text x="34" y="195.0" class="detail" text-anchor="start">or in a simulator</text>
<text x="34" y="212.0" class="detail" text-anchor="start"></text>
<text x="34" y="229.0" class="detail" text-anchor="start">VGA on the Tiny VGA</text>
<text x="34" y="246.0" class="detail" text-anchor="start">Pmod: uo_out[7:0]</text>
<text x="34" y="263.0" class="detail" text-anchor="start"></text>
<text x="34" y="280.0" class="detail" text-anchor="start">project clock</text>
<text x="34" y="297.0" class="detail" text-anchor="start">25.175 MHz typical</text>
<rect x="296" y="44" width="250" height="36" rx="8" fill="#f2eefd" stroke="#c2b2f0" stroke-width="1.25"/>
<text x="308" y="66" class="title" text-anchor="start" fill="#1d2433">ttcap on a host computer</text>
<path d="M336 80 L336 128.0" fill="none" stroke="#6b46d6" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-ctl)"/>
<text x="346" y="105" class="net" text-anchor="start" fill="#6b46d6">clock, reset, start, stop</text>
<rect x="296" y="130.0" width="250" height="92" rx="8" fill="#eaf1fd" stroke="#9dbcef" stroke-width="1.25"/>
<text x="308" y="152.0" class="title" text-anchor="start" fill="#1d2433">Tiny Tapeout demo board</text>
<text x="308" y="171.0" class="detail" text-anchor="start">its RP2040 or RP2350 samples</text>
<text x="308" y="188.0" class="detail" text-anchor="start">uo_out with PIO, once a clock;</text>
<text x="308" y="205.0" class="detail" text-anchor="start">stock firmware or vgacap's own</text>
<path d="M200 176 L294 176" fill="none" stroke="#1c64d4" stroke-width="3" marker-end="url(#arrow-sig)"/>
<text x="248.0" y="168" class="net" text-anchor="middle" fill="#1c64d4">uo_out[7:0]</text>
<path d="M546 176 L714 176" fill="none" stroke="#f2620c" stroke-width="4.5" marker-end="url(#arrow-str)"/>
<text x="631.0" y="167" class="net" text-anchor="middle" fill="#f2620c">USB serial or websocket</text>
<text x="631.0" y="195" class="detail" text-anchor="middle">up to ~0.7 MB/s</text>
<rect x="296" y="236.0" width="250" height="92" rx="8" fill="#eaf1fd" stroke="#9dbcef" stroke-width="1.25"/>
