<path d="M546 494 L714 494" fill="none" stroke="#f2620c" stroke-width="4.5" marker-end="url(#arrow-str)"/>
<text x="631.0" y="485" class="net" text-anchor="middle" fill="#f2620c">trace files</text>
<text x="631.0" y="513" class="detail" text-anchor="middle">every clock</text>
<rect x="716" y="130.0" width="196" height="410.0" rx="6" fill="#f7f8fb" stroke="#2b3445" stroke-width="2.5"/>
<text x="814.0" y="156.0" class="title" text-anchor="middle">vgacap stream</text>
<text x="814.0" y="174.0" class="detail" text-anchor="middle">include/vgacap/stream.h</text>
<rect x="730" y="194.0" width="54" height="24" rx="3" fill="#ffffff" stroke="#2b3445" stroke-width="1.5"/>
<text x="757" y="210.5" class="pad" text-anchor="middle">VGCH</text>
<text x="794" y="210.5" class="detail" text-anchor="start">header</text>
<rect x="730" y="244.0" width="54" height="24" rx="3" fill="#ffffff" stroke="#f2620c" stroke-width="1.5"/>
<text x="757" y="260.5" class="pad" text-anchor="middle">RAW</text>
<text x="794" y="260.5" class="detail" text-anchor="start">every sample</text>
