<text x="757" y="310.5" class="pad" text-anchor="middle">RLE</text>
<text x="794" y="310.5" class="detail" text-anchor="start">value + run</text>
<rect x="730" y="344.0" width="54" height="24" rx="3" fill="#ffffff" stroke="#f2620c" stroke-width="1.5"/>
<text x="757" y="360.5" class="pad" text-anchor="middle">FRAM</text>
