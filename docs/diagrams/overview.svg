<text x="308" y="277.0" class="detail" text-anchor="start">its RP1 I/O chip samples</text>
<text x="308" y="294.0" class="detail" text-anchor="start">uo_out on the GPIO header</text>
<path d="M200 282 L294 282" fill="none" stroke="#1c64d4" stroke-width="3" marker-end="url(#arrow-sig)"/>
<text x="248.0" y="274" class="net" text-anchor="middle" fill="#1c64d4">uo_out[7:0]</text>
<path d="M546 282 L714 282" fill="none" stroke="#f2620c" stroke-width="4.5" marker-end="url(#arrow-str)"/>
<text x="631.0" y="273" class="net" text-anchor="middle" fill="#f2620c">on the Pi itself</text>
<text x="631.0" y="301" class="detail" text-anchor="middle">DMA to DRAM</text>
<rect x="296" y="342.0" width="250" height="92" rx="8" fill="#eaf1fd" stroke="#9dbcef" stroke-width="1.25"/>
<text x="308" y="364.0" class="title" text-anchor="start" fill="#1d2433">FPGA capture logic</text>
<text x="308" y="383.0" class="detail" text-anchor="start">rtl/: built into the FPGA</text>
<text x="308" y="400.0" class="detail" text-anchor="start">design next to the project</text>
<path d="M200 388 L294 388" fill="none" stroke="#1c64d4" stroke-width="3" marker-end="url(#arrow-sig)"/>
<text x="248.0" y="380" class="net" text-anchor="middle" fill="#1c64d4">uo_out[7:0]</text>
<path d="M546 388 L714 388" fill="none" stroke="#f2620c" stroke-width="4.5" marker-end="url(#arrow-str)"/>
<text x="631.0" y="379" class="net" text-anchor="middle" fill="#f2620c">the FPGA's own link</text>
<text x="631.0" y="407" class="detail" text-anchor="middle">one byte a clock</text>
<rect x="296" y="448.0" width="250" height="92" rx="8" fill="#eaf1fd" stroke="#9dbcef" stroke-width="1.25"/>
