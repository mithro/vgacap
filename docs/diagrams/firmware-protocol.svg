<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">A frame capture through the vgacap firmware</title>
<desc id="d">ttcap on the host and the vgacap firmware exchange lines: a sync with hello, setup of the clock and reset, the frame command and its ok, then TIME, FRAM and DONE chunks, then the clock stopped.</desc>
<style>
  .head { font-size: 15px; font-weight: 600; fill: #1d2433; }
  .phase { font-size: 12px; font-weight: 700; fill: #5b6577; letter-spacing: 0.04em; }
  .msg { font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .legend { font-size: 12.5px; fill: #1d2433; }
</style>
<defs>
<marker id="m-cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c64d4"/></marker>
<marker id="m-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14845a"/></marker>
<marker id="m-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2620c"/></marker>
</defs>
<rect x="0" y="0" width="760" height="760" fill="#ffffff"/>
<rect x="16" y="73" width="728" height="58" rx="6" fill="#f3f5f9"/>
<text x="26" y="106.0" class="phase" text-anchor="start">sync</text>
<rect x="16" y="133" width="728" height="298" rx="6" fill="#f3f5f9"/>
<text x="26" y="286.0" class="phase" text-anchor="start">setup</text>
<rect x="16" y="433" width="728" height="208" rx="6" fill="#f3f5f9"/>
<text x="26" y="541.0" class="phase" text-anchor="start">capture</text>
<rect x="16" y="643" width="728" height="58" rx="6" fill="#f3f5f9"/>
<text x="26" y="676.0" class="phase" text-anchor="start">teardown</text>
<rect x="70" y="16" width="160" height="44" rx="8" fill="#eaf1fd" stroke="#9dbcef" stroke-width="1.25"/>
<text x="150" y="43" class="head" text-anchor="middle">ttcap (host)</text>
<line x1="150" y1="60" x2="150" y2="710" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="530" y="16" width="160" height="44" rx="8" fill="#eaf1fd" stroke="#9dbcef" stroke-width="1.25"/>
<text x="610" y="43" class="head" text-anchor="middle">vgacap firmware</text>
<line x1="610" y1="60" x2="610" y2="710" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="150" y1="92" x2="606" y2="92" stroke="#1c64d4" stroke-width="1.75" marker-end="url(#m-cmd)"/>
<text x="380.0" y="87" class="msg" text-anchor="middle" fill="#1c64d4">0x03  hello</text>
<line x1="610" y1="122" x2="154" y2="122" stroke="#14845a" stroke-width="1.75" marker-end="url(#m-reply)"/>
<text x="380.0" y="117" class="msg" text-anchor="middle" fill="#14845a">ok vgacap-fw proto=1 ...</text>
<line x1="150" y1="152" x2="606" y2="152" stroke="#1c64d4" stroke-width="1.75" marker-end="url(#m-cmd)"/>
<text x="380.0" y="147" class="msg" text-anchor="middle" fill="#1c64d4">clock hz=0</text>
<line x1="610" y1="182" x2="154" y2="182" stroke="#14845a" stroke-width="1.75" marker-end="url(#m-reply)"/>
<text x="380.0" y="177" class="msg" text-anchor="middle" fill="#14845a">ok clock_hz=0 ...</text>
<line x1="150" y1="212" x2="606" y2="212" stroke="#1c64d4" stroke-width="1.75" marker-end="url(#m-cmd)"/>
<text x="380.0" y="207" class="msg" text-anchor="middle" fill="#1c64d4">reset hold=1</text>
<line x1="610" y1="242" x2="154" y2="242" stroke="#14845a" stroke-width="1.75" marker-end="url(#m-reply)"/>
<text x="380.0" y="237" class="msg" text-anchor="middle" fill="#14845a">ok reset=1</text>
<line x1="150" y1="272" x2="606" y2="272" stroke="#1c64d4" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#m-cmd)"/>
<text x="380.0" y="267" class="msg" text-anchor="middle" fill="#1c64d4">asic_select index=N   (ASIC only)</text>
<line x1="610" y1="302" x2="154" y2="302" stroke="#14845a" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#m-reply)"/>
<text x="380.0" y="297" class="msg" text-anchor="middle" fill="#14845a">ok asic_select index=N</text>
<line x1="150" y1="332" x2="606" y2="332" stroke="#1c64d4" stroke-width="1.75" marker-end="url(#m-cmd)"/>
<text x="380.0" y="327" class="msg" text-anchor="middle" fill="#1c64d4">clock hz=25000000</text>
<line x1="610" y1="362" x2="154" y2="362" stroke="#14845a" stroke-width="1.75" marker-end="url(#m-reply)"/>
<text x="380.0" y="357" class="msg" text-anchor="middle" fill="#14845a">ok clock_hz=25000000 ... period=4</text>
<line x1="150" y1="392" x2="606" y2="392" stroke="#1c64d4" stroke-width="1.75" marker-end="url(#m-cmd)"/>
<text x="380.0" y="387" class="msg" text-anchor="middle" fill="#1c64d4">reset hold=0</text>
<line x1="610" y1="422" x2="154" y2="422" stroke="#14845a" stroke-width="1.75" marker-end="url(#m-reply)"/>
<text x="380.0" y="417" class="msg" text-anchor="middle" fill="#14845a">ok reset=0</text>
<line x1="150" y1="452" x2="606" y2="452" stroke="#1c64d4" stroke-width="1.75" marker-end="url(#m-cmd)"/>
<text x="380.0" y="447" class="msg" text-anchor="middle" fill="#1c64d4">frame cpl=800 ... max_frames=2 ...</text>
<line x1="610" y1="482" x2="154" y2="482" stroke="#14845a" stroke-width="1.75" marker-end="url(#m-reply)"/>
<text x="380.0" y="477" class="msg" text-anchor="middle" fill="#14845a">ok frame</text>
<line x1="610" y1="512" x2="154" y2="512" stroke="#f2620c" stroke-width="4" marker-end="url(#m-data)"/>
<rect x="272.2" y="501" width="215.6" height="22" rx="4" fill="#fff2e8" stroke="#f8b48a" stroke-width="1"/>
<text x="380.0" y="516.5" class="msg" text-anchor="middle" fill="#1d2433">TIME  frame window=481 ...</text>
<line x1="610" y1="542" x2="154" y2="542" stroke="#f2620c" stroke-width="4" marker-end="url(#m-data)"/>
<rect x="314.0" y="531" width="132.0" height="22" rx="4" fill="#fff2e8" stroke="#f8b48a" stroke-width="1"/>
<text x="380.0" y="546.5" class="msg" text-anchor="middle" fill="#1d2433">FRAM  picture 0</text>
<line x1="610" y1="572" x2="154" y2="572" stroke="#f2620c" stroke-width="4" marker-end="url(#m-data)"/>
<rect x="314.0" y="561" width="132.0" height="22" rx="4" fill="#fff2e8" stroke="#f8b48a" stroke-width="1"/>
<text x="380.0" y="576.5" class="msg" text-anchor="middle" fill="#1d2433">FRAM  picture 1</text>
<line x1="610" y1="602" x2="154" y2="602" stroke="#f2620c" stroke-width="4" marker-end="url(#m-data)"/>
<rect x="268.4" y="591" width="223.2" height="22" rx="4" fill="#fff2e8" stroke="#f8b48a" stroke-width="1"/>
<text x="380.0" y="606.5" class="msg" text-anchor="middle" fill="#1d2433">TIME  frames=2 stalls=0 ...</text>
<line x1="610" y1="632" x2="154" y2="632" stroke="#f2620c" stroke-width="4" marker-end="url(#m-data)"/>
<rect x="355.8" y="621" width="48.4" height="22" rx="4" fill="#fff2e8" stroke="#f8b48a" stroke-width="1"/>
<text x="380.0" y="636.5" class="msg" text-anchor="middle" fill="#1d2433">DONE</text>
<line x1="150" y1="662" x2="606" y2="662" stroke="#1c64d4" stroke-width="1.75" marker-end="url(#m-cmd)"/>
<text x="380.0" y="657" class="msg" text-anchor="middle" fill="#1c64d4">clock hz=0</text>
<line x1="610" y1="692" x2="154" y2="692" stroke="#14845a" stroke-width="1.75" marker-end="url(#m-reply)"/>
<text x="380.0" y="687" class="msg" text-anchor="middle" fill="#14845a">ok clock_hz=0 ...</text>
<line x1="190.0" y1="734" x2="222.0" y2="734" stroke="#1c64d4" stroke-width="1.75" marker-end="url(#m-cmd)"/>
<text x="230.0" y="738.5" class="legend" text-anchor="start">command</text>
<line x1="321.8" y1="734" x2="353.8" y2="734" stroke="#14845a" stroke-width="1.75" marker-end="url(#m-reply)"/>
<text x="361.8" y="738.5" class="legend" text-anchor="start">reply line</text>
<line x1="475.8" y1="734" x2="507.8" y2="734" stroke="#f2620c" stroke-width="4" marker-end="url(#m-data)"/>
<text x="515.8" y="738.5" class="legend" text-anchor="start">chunk</text>
</svg>
