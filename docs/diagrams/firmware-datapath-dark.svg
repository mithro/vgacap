<svg xmlns="http://www.w3.org/2000/svg" width="520" height="744" viewBox="0 0 520 744" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The vgacap firmware data path</title>
<desc id="d">uo_out from the design on the breakout enters PIO block 1 of the RP2350B, then its RX FIFO and two DMA channels, into two buffers for a stream or one 440 KB arena for a frame, then out of the TinyUSB serial port over USB to ttcap, which writes a .vgacap file.</desc>
